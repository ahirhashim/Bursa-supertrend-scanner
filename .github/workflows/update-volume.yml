name: Update Bursa Daily Volume

on:
  workflow_dispatch:
  schedule:
    - cron: "15 10 * * 1-5"

concurrency:
  group: bursa-daily-volume
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-volume:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install requests

      - name: Update Daily Volume
        env:
          ITICK_API_KEY: ${{ secrets.ITICK_API_KEY }}
        run: python scripts/update_volume.py

      - name: Save snapshot to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add volume_snapshot.json
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "Update Bursa daily volume snapshot"
            git push
          fi
